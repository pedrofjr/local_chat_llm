[package]
name = "local-llm"
version = "0.4.0"
edition = "2021"
description = "LAN P2P room chat that looks like a local LLM terminal"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
argon2 = { version = "0.5", default-features = false, features = ["std", "alloc", "password-hash"] }
blake3 = "1"
chacha20poly1305 = "0.10"
# Already in the tree via iroh; taken as a direct dependency so whispers can do
# X25519 without pulling a second copy of the curve in.
curve25519-dalek = "5"
crossterm = "0.29"
data-encoding = "2"
directories = "6"
futures-lite = "2"
iroh = "1"
iroh-gossip = "0.101"
iroh-mdns-address-lookup = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc", "use-std"] }
rand = "0.8"
ratatui = "0.30"
# Draws pictures through whatever the terminal speaks: sixel on Windows
# Terminal 1.22+, unicode halfblocks everywhere else. No native C library
# involved -- the sixel encoder is icy_sixel, in Rust.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
# Only the three formats we accept. Every extra decoder is more binary and
# more parser exposed to whatever a peer sends.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.8"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
